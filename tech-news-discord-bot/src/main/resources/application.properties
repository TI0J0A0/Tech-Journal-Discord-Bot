# ==========================================
# Spring Boot Configuration
# ==========================================
spring.application.name=tech-news-discord-bot
server.port=8080

# ==========================================
# Database Configuration (H2)
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/techjournal;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (opcional, apenas para desenvolvimento)
spring.h2.console.enabled=false

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=INFO
logging.level.com.techjournal=DEBUG
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==========================================
# Discord Bot Configuration
# ==========================================
# Token do seu bot Discord (obtenha em https://discord.com/developers/applications)
app.discord.token=${DISCORD_BOT_TOKEN:seu_token_aqui}

# ID do CANAL DE FÓRUM onde as notícias serão publicadas (cada notícia vira um post)
# IMPORTANTE: deve ser um Canal de Fórum, NÃO um canal de texto.
# Veja FORUM_SETUP.md para instruções detalhadas de configuração.
app.discord.channel-id=${DISCORD_CHANNEL_ID:seu_id_canal_aqui}

# ==========================================
# RSS Feeds Configuration
# ==========================================
# URLs dos feeds RSS a serem monitorados
app.feeds.urls[0]=https://feeds.techcrunch.com/techcrunch/
app.feeds.urls[1]=https://feeds.arstechnica.com/arstechnica/index
app.feeds.urls[2]=https://thehackernews.com/feeds/posts/default?alt=rss
app.feeds.urls[3]=https://feeds.feedburner.com/TheHackersNews

# ==========================================
# Scheduler Configuration
# ==========================================
# Intervalo de verificação de feeds em milissegundos
# 3600000 ms = 1 hora
# 1800000 ms = 30 minutos
# 600000 ms = 10 minutos
app.scheduler.fixed-delay=3600000

# Delay inicial antes da primeira execução em milissegundos
app.scheduler.initial-delay=5000

# Alternativa: usar CRON (descomente em FeedScheduledTask)
# Exemplos:
# 0 */4 * * * ?    -> A cada 4 horas
# 0 0 * * * ?      -> Diariamente à meia-noite
# 0 9,14,19 * * *  -> 9h, 14h e 19h todos os dias
